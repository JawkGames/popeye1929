# Android derlemesi: SADECE elle (Actions > "Android Build" > Run workflow); push'ta çalışmaz
# - Ortak JawkGames upload key (secrets.UPLOAD_KEYSTORE_BASE64 + secrets.UPLOAD_KEY_PASSWORD, alias: upload) ile imzalı AAB + test APK üretir
name: Android Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Capacitor sync (www -> android)
        run: npx cap sync android

      - name: Sürüm bilgisi
        run: |
          echo "VERSION_CODE=$((100 + ${{ github.run_number }}))" >> $GITHUB_ENV
          echo "VERSION_NAME=$(grep -oP "VERSION:\s*'v\K[^']+" www/src/config.js)" >> $GITHUB_ENV

      - name: Keystore hazırla (JawkGames ortak upload key)
        env:
          KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > $RUNNER_TEMP/release.jks
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV
          fi

      - name: Derle (AAB + Test APK)
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          KEY_ALIAS: upload
          KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleDebug --no-daemon

      - name: Çıktıları Releases'e yükle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION_NAME}-b${{ github.run_number }}"
          mkdir -p cikti
          cp android/app/build/outputs/bundle/release/*.aab "cikti/popeye1929-${VERSION_NAME}.aab"
          cp android/app/build/outputs/apk/debug/*.apk "cikti/popeye1929-${VERSION_NAME}-test.apk"
          if [ -f android/app/build/outputs/mapping/release/mapping.txt ]; then cp android/app/build/outputs/mapping/release/mapping.txt "cikti/popeye1929-${VERSION_NAME}-mapping.txt"; fi
          gh release create "$TAG" cikti/* --target "${{ github.sha }}" --title "Popeye 1929 v${VERSION_NAME} (build ${{ github.run_number }})" --notes "AAB: Google Play'e yüklenecek (ortak upload key ile imzalı). APK: telefona kurup test için."
          gh release list --limit 100 --json tagName --jq '.[2:][].tagName' | while read -r t; do gh release delete "$t" --yes --cleanup-tag; done
