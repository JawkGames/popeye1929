<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <title>Popeye 1929: Iron Armada</title>
  <style>
    @font-face {
      font-family: 'Bangers';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url(fonts/bangers-latin-ext-400-normal.woff2) format('woff2');
      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }
    @font-face {
      font-family: 'Bangers';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url(fonts/bangers-latin-400-normal.woff2) format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    @font-face {
      font-family: 'Nunito';
      font-style: normal;
      font-weight: 800;
      font-display: swap;
      src: url(fonts/nunito-latin-ext-800-normal.woff2) format('woff2');
      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }
    @font-face {
      font-family: 'Nunito';
      font-style: normal;
      font-weight: 800;
      font-display: swap;
      src: url(fonts/nunito-latin-800-normal.woff2) format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #040b16;
      overflow: hidden;
      touch-action: none;
      font-family: 'Bangers', 'Nunito', "Arial Black", Impact, sans-serif;
    }
    #game-wrap {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #0a1b32 0%, #030912 100%);
    }
    canvas {
      display: block;
      touch-action: none;
      box-shadow: 0 0 36px rgba(0, 180, 255, 0.22);
    }
    /* 9:16 Açılış / Loading Ekranı: Boşken siyah-beyaz (#ac_gri), doldukça soldan sağa renklenir (#acilis) */
    #acilis {
      position: absolute;
      z-index: 90;
      width: 100%;
      height: 100%;
      background: #040b16 url('assets/acilis.jpg') center center / 100% 100% no-repeat;
      transition: opacity 0.45s ease;
    }
    #acilis.bit {
      opacity: 0;
      pointer-events: none;
    }
    #ac_gri {
      position: absolute;
      inset: 0;
      background: inherit;
      filter: grayscale(1) brightness(0.92);
      --p: -6%;
      -webkit-mask-image: linear-gradient(90deg, transparent var(--p), #000 calc(var(--p) + 6%));
      mask-image: linear-gradient(90deg, transparent var(--p), #000 calc(var(--p) + 6%));
    }
  </style>
</head>
<body>
  <div id="game-wrap">
    <canvas id="game-canvas"></canvas>
    <div id="acilis"><div id="ac_gri"></div></div>
  </div>
  <script src="src/config.js"></script>
  <script src="src/i18n.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/pool.js"></script>
  <script src="src/atlas.js"></script>
  <script src="src/stages.js"></script>
  <script src="src/skills.js"></script>
  <script src="src/formations.js"></script>
  <script src="src/player.js"></script>
  <script src="src/enemies.js"></script>
  <script src="src/ui.js"></script>
  <script src="src/ads.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
